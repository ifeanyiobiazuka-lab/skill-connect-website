<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Contact | Job and Skill</title><link rel="stylesheet" href="style.css"><style>.contact-page{max-width:1000px;margin:70px auto;padding:0 25px}.contact-page h1{font-size:48px;margin-bottom:10px}.contact-page .intro{color:#667085;margin-bottom:35px}.contact-box{background:#fff;border:1px solid #e5e9ef;border-radius:18px;padding:35px;box-shadow:0 15px 40px rgba(20,30,50,.06)}.field{margin-bottom:18px}.field label{display:block;font-weight:700;margin-bottom:8px}.field input,.field textarea{width:100%;padding:14px;border:1px solid #d8dee8;border-radius:9px;font:inherit}.field textarea{min-height:160px}.contact-btn{background:#2563eb;color:white;border:0;padding:14px 25px;border-radius:8px;font-weight:700;cursor:pointer}.notice{margin-bottom:18px;padding:12px;border-radius:8px;display:none}.notice.error{display:block;background:#fff1f2;color:#b42318}.notice.success{display:block;background:#ecfdf3;color:#067647}</style></head><body><header class="header"><div class="navbar"><a class="logo" href="index.html"><span>Job</span> and Skill</a><nav class="nav-links"><a href="index.html">Home</a><a href="services.html">Services</a><a href="courses.html">Courses</a><a href="about.html">About</a><a class="active" href="contact.html">Contact</a></nav><div class="nav-buttons"><a href="login.html" class="login-btn">Login</a><a href="signup.html" class="signup-btn">Get Started</a></div></div></header><main class="contact-page"><p class="hero-tag">GET IN TOUCH</p><h1>Contact Job and Skill</h1><p class="intro">Have a question about a course, programme or application? Send us a message.</p><div class="contact-box"><div id="notice" class="notice"></div><form id="contactForm"><div class="field"><label>Name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Message</label><textarea id="message" required></textarea></div><button class="contact-btn">Send Message</button></form></div></main><script>const f=document.getElementById("contactForm"),n=document.getElementById("notice");f.addEventListener("submit",async e=>{e.preventDefault();try{const r=await fetch("/api/contact",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,email:email.value,message:message.value})});const d=await r.json();if(!r.ok)throw Error(d.error);n.textContent=d.message;n.className="notice success";f.reset()}catch(e){n.textContent=e.message;n.className="notice error"}})</script></body></html>
