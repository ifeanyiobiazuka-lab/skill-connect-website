<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Review Course | Job and Skill</title><link rel="stylesheet" href="review.css"><style>
.course-box{max-width:1050px;margin:50px auto;padding:36px;background:#fff;border:1px solid #e7ebf0;border-radius:18px;box-shadow:0 15px 40px rgba(20,30,50,.06)}.course-box h1{font-size:38px;color:#172033;margin-bottom:8px}.meta{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0}.meta span{padding:8px 13px;background:#f2f6ff;border-radius:30px;color:#2457d6;font-weight:700;font-size:13px}.apply-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{margin-bottom:18px}.field label{display:block;font-weight:700;margin-bottom:8px}.field input,.field select,.field textarea{width:100%;padding:14px;border:1px solid #d8dee8;border-radius:9px;font:inherit}.field textarea{min-height:140px;resize:vertical}.full{grid-column:1/-1}.submit-btn{border:0;background:#2563eb;color:white;padding:15px 25px;border-radius:9px;font-weight:700;cursor:pointer}.notice{padding:13px;border-radius:9px;margin-bottom:18px;display:none}.notice.error{display:block;background:#fff1f2;color:#b42318}.notice.success{display:block;background:#ecfdf3;color:#067647}@media(max-width:700px){.apply-grid{grid-template-columns:1fr}.full{grid-column:auto}.course-box{margin:20px;padding:22px}}
</style></head>
<body><header class="navbar"><div class="logo"><span>Job</span> and Skill</div><nav><a href="index.html">Home</a><a href="services.html">Services</a><a href="courses.html" class="active">Courses</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav><div class="nav-buttons"><a href="login.html" class="login-btn">Login</a><a href="signup.html" class="signup-btn">Get Started</a></div></header>
<main><section class="course-box"><p class="section-label">COURSE APPLICATION</p><h1 id="courseTitle">Loading course...</h1><p id="courseDescription">Please wait while we load the course.</p><div class="meta"><span id="courseCategory"></span><span id="courseLevel"></span><span id="coursePrice"></span></div>
<div id="notice" class="notice"></div><form id="applicationForm"><div class="apply-grid"><div class="field"><label>Programme Duration</label><select id="programme" required><option value="">Choose duration</option><option>3 Months</option><option>6 Months</option><option>9 Months</option><option>12 Months</option></select></div><div class="field"><label>Phone Number</label><input id="phone" placeholder="08012345678" required></div><div class="field full"><label>Why do you want to learn this course?</label><textarea id="message" required placeholder="Tell the administrator about your goals and what you hope to achieve..."></textarea></div><div class="field full"><label><input id="agree" type="checkbox" required> I confirm that the information provided is correct and I want my application reviewed.</label></div></div><button class="submit-btn" type="submit">Submit for Administrator Review →</button></form></section></main>
<script>
const token=localStorage.getItem("jobSkillToken");const slug=new URLSearchParams(location.search).get("course")||"web-development";
const $=id=>document.getElementById(id);function notice(m,c="error"){ $("notice").textContent=m;$("notice").className="notice "+c; }
async function load(){try{const r=await fetch("/api/courses/"+encodeURIComponent(slug));const d=await r.json();if(!r.ok)throw Error(d.error);const c=d.course;$("courseTitle").textContent=c.title;$("courseDescription").textContent=c.description;$("courseCategory").textContent=c.category;$("courseLevel").textContent=c.level;$("coursePrice").textContent="₦"+Number(c.price).toLocaleString();}catch(e){notice(e.message)}}
$("applicationForm").addEventListener("submit",async e=>{e.preventDefault();if(!token){location.href="login.html?return="+encodeURIComponent(location.href);return;}try{const r=await fetch("/api/applications",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({courseSlug:slug,programme:$("programme").value,phone:$("phone").value,message:$("message").value})});const d=await r.json();if(!r.ok)throw Error(d.error);notice(d.message+" You can track it from your dashboard.","success");setTimeout(()=>location.href="/user/dashboard.html",900)}catch(e){notice(e.message)}});
load();
</script></body></html>
